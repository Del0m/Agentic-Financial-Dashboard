# dev mode on a mac (docs/superpowers/specs/2026-11-01-docker-dev-design.md): the repo is mounted into both
# containers for live reload, and ollama stays on the mac for its gpu
services:
  backend:
    build: ./backend
    working_dir: /app/backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      TZ: America/New_York           # the app's "today" (date.today()) must be the mac's, not utc's
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"        # the same address the host uvicorn binds, so the two clash instead of sharing

  frontend:
    build: ./frontend
    working_dir: /app/frontend
    command: npm run dev -- -H 0.0.0.0
    environment:
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next:/app/frontend/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  frontend_next:
