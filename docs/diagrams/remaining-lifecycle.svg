als,</text><text x="523.37" y="837.312" fill="#000" font-size="15" textLength="225.183">user accepts or dismisses each</text><text x="523.37" y="854.978" fill="#000" font-size="15" textLength="139.299">(interrupt, TPC-25)</text></g><!--entity approval--><g class="entity" data-qualified-name="approval" id="ent0008" data-source-line="14"><rect x="341.92" y="947.138" width="226.082" height="55.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="351.92" y="971.64" fill="#000" font-size="15" textLength="206.082">Existing approval core + API</text><text x="351.92" y="989.306" fill="#000" font-size="15" textLength="115.73">alerts and goals</text></g><!--entity close--><g class="entity" data-qualified-name="close" id="ent0009" data-source-line="15"><rect x="54.38" y="1099.468" width="279.153" height="72.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="64.38" y="1123.97" fill="#000" font-size="15" textLength="220.781">PLANNED period-close service</text><text x="64.38" y="1141.636" fill="#000" font-size="15" textLength="187.72">existing pure close maths</text><text x="64.38" y="1159.302" fill="#000" font-size="15" textLength="259.153">+ DB rollover + accepted proposals</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="29"><path d="M293.99,452.148 L293.99,515.146 A0,0 0 0 0 293.99,515.146 L637.922,515.146 A0,0 0 0 0 637.922,515.146 L637.922,462.148 L627.922,452.148 L511.63,452.148 L619.78,368.368 L503.63,452.148 L293.99,452.148 A0,0 0 0 0 293.99,452.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M627.922,452.148 L627.922,462.148 L637.922,462.148 L627.922,452.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="299.99" y="471.65" fill="#000" font-size="15" textLength="301.033">Design gap: 3 annual occurrences cannot</text><text x="299.99" y="489.316" fill="#000" font-size="15" textLength="299.839">fit in a 180-day lookback. 