<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1178px;height:1270px;background:#FFFFFF;" width="1178px" height="1270px" viewBox="0 0 1178 1270" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="377.72" y="23.535" fill="#000" font-size="14" textLength="416.151" font-weight="700">Planned autonomous lifecycle and inputs that must agree</text></g><!--entity schedule--><g class="entity" data-qualified-name="schedule" id="ent0001" data-source-line="7"><rect x="7" y="44.488" width="261.165" height="72.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="68.99" fill="#000" font-size="15" textLength="241.165">Implemented scheduler (TPC-21)</text><text x="17" y="86.656" fill="#000" font-size="15" textLength="205.613">user + timezone + due date</text><text x="17" y="104.322" fill="#000" font-size="15" textLength="235.92">retry / catch-up / overlap policy</text></g><!--entity sync--><g class="entity" data-qualified-name="sync" id="ent0002" data-source-line="8"><rect x="161.71" y="196.478" width="255.737" height="55.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="171.71" y="220.98" fill="#000" font-size="15" textLength="150.168">Existing sync service</text><text x="171.71" y="238.646" fill="#000" font-size="15" textLength="235.737">transactions + balances + debts</text></g><!--entity budget--><g class="entity" data-qualified-name="budget" id="ent0003" data-source-line="9"><rect x="267.15" y="550.148" width="234.856" height="55.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="277.15" y="574.65" fill="#000" font-size="15" textLength="161.448">Existing budget graph</text><text x="277.15" y="592.316" fill="#000" font-size="15" textLength="214.856">fit / pace / diagnose / decide</text></g><!--entity recurring--><g class="entity" data-qualified-name="recurring" id="ent0004" data-source-line="10"><rect x="538.48" y="312.818" width="252.2" height="55.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="548.48" y="337.32" fill="#000" font-size="15" textLength="232.2">Implemented recurring detector</text><text x="548.48" y="354.986" fill="#000" font-size="15" textLength="209.026">180-day transaction window</text></g><!--entity forecast--><g class="entity" data-qualified-name="forecast" id="ent0005" data-source-line="11"><rect x="781.28" y="447.148" width="252.603" height="72.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="791.28" y="471.65" fill="#000" font-size="15" textLength="196.399">Implemented cash forecast</text><text x="791.28" y="489.316" fill="#000" font-size="15" textLength="232.603">checking cash + scheduled bills</text><text x="791.28" y="506.982" fill="#000" font-size="15" textLength="226.941">+ income + everyday spending</text></g><!--entity payoff--><g class="entity" data-qualified-name="payoff" id="ent0006" data-source-line="12"><rect x="510.81" y="639.308" width="267.537" height="55.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="520.81" y="663.81" fill="#000" font-size="15" textLength="247.537">Implemented debt-payoff planner</text><text x="520.81" y="681.476" fill="#000" font-size="15" textLength="245.969">minimums + APR + extra amount</text></g><!--entity goal--><g class="entity" data-qualified-name="goal" id="ent0007" data-source-line="13"><rect x="515.99" y="777.478" width="245.183" height="90.664" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="525.99" y="801.98" fill="#000" font-size="15" textLength="79.944">Goal graph</text><text x="525.99" y="819.646" fill="#000" font-size="15" textLength="187.046">propose affordable goals,</text><text x="525.99" y="837.312" fill="#000" font-size="15" textLength="225.183">user accepts or dismisses each</text><text x="525.99" y="854.978" fill="#000" font-size="15" textLength="139.299">(interrupt, TPC-25)</text></g><!--entity approval--><g class="entity" data-qualified-name="approval" id="ent0008" data-source-line="14"><rect x="344.54" y="947.138" width="226.082" height="55.332" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="354.54" y="971.64" fill="#000" font-size="15" textLength="206.082">Existing approval core + API</text><text x="354.54" y="989.306" fill="#000" font-size="15" textLength="115.73">alerts and goals</text></g><!--entity close--><g class="entity" data-qualified-name="close" id="ent0009" data-source-line="15"><rect x="57.01" y="1099.468" width="279.153" height="72.998" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="67.01" y="1123.97" fill="#000" font-size="15" textLength="248.152">Implemented period-close service</text><text x="67.01" y="1141.636" fill="#000" font-size="15" textLength="187.72">existing pure close maths</text><text x="67.01" y="1159.302" fill="#000" font-size="15" textLength="259.153">+ DB rollover + accepted proposals</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="29"><path d="M296.92,452.148 L296.92,515.146 A0,0 0 0 0 296.92,515.146 L642.244,515.146 A0,0 0 0 0 642.244,515.146 L642.244,462.148 L632.244,452.148 L516.35,452.148 L627.45,368.368 L508.35,452.148 L296.92,452.148 A0,0 0 0 0 296.92,452.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M632.244,452.148 L632.244,462.148 L642.244,462.148 L632.244,452.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="302.92" y="471.65" fill="#000" font-size="15" textLength="322.969">Annual detection is deferred. Tight cadence,</text><text x="302.92" y="489.316" fill="#000" font-size="15" textLength="324.324">price-step, restart and monthly anchor rules</text><text x="302.92" y="506.982" fill="#000" font-size="15" textLength="305.31">are measured on planted and noisy users.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="34"><path d="M813.58,635.478 L813.58,698.476 A0,0 0 0 0 813.58,698.476 L1163.591,698.476 A0,0 0 0 0 1163.591,698.476 L1163.591,645.478 L1153.591,635.478 L978.77,635.478 L923.59,520.468 L970.77,635.478 L813.58,635.478 A0,0 0 0 0 813.58,635.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1153.591,635.478 L1153.591,645.478 L1163.591,645.478 L1153.591,635.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="819.58" y="654.98" fill="#000" font-size="15" textLength="316.75">Define pending vs posted, checking vs card</text><text x="819.58" y="672.646" fill="#000" font-size="15" textLength="308.701">spend, duplicate card payments, currency,</text><text x="819.58" y="690.312" fill="#000" font-size="15" textLength="329.011">and the income floor before trusting surplus.</text></g><!--link schedule to sync--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="16" data-link-type="dependency"><path d="M176.33,117.968 C202.54,142.308 232.947,170.545 256.837,192.735" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="schedule-to-sync"/><polygon points="260.5,196.138,256.628,187.082,256.837,192.735,251.184,192.944,260.5,196.138" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="228.2" y="162.98" fill="#000" font-size="15" textLength="34.233">daily</text></g><!--link sync to budget--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk11" data-source-line="17" data-link-type="dependency"><path d="M279.71,251.948 C261.32,306.788 228.12,433.888 279.58,520.148 C286.85,532.328 293.537,539.355 305.597,547.065" style="stroke:#181818;stroke-width:1;" fill="none" id=