" font-size="12" textLength="168.135">LLM: answer or request tools</text><rect x="247.055" y="292.887" width="218.727" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="257.055" y="314.488" fill="#000" font-size="12" textLength="198.727">Final LLM call with no tools bound</text><polygon points="244.703,333.02,256.703,345.02,244.703,357.02,232.703,345.02,244.703,333.02" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="114.861" y="425.497" width="259.684" height="62.398" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="124.861" y="447.099" fill="#000" font-size="12" textLength="84.773">Tool boundary</text><text x="124.861" y="461.231" fill="#000" font-size="12" textLength="239.684">get_accounts / get_debts / get_spending</text><text x="124.861" y="475.364" fill="#000" font-size="12" textLength="172.406">search_kb / plan_debt_payoff</text><polygon points="203.534,515.396,285.873,515.396,297.873,527.396,285.873,539.396,203.534,539.396,191.534,527.396,203.534,515.396" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="203.534" y="531.553" fill="#000" font-size="11" textLength="82.339">User-data tool?</text><text x="174.051" y="525.075" fill="#000" font-size="11" textLength="17.483">yes</text><text x="297.873" y="525.075" fill="#000" font-size="11" textLength="84.6">public guidance</text><rect x="16" y="549.396" width="242.176" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="570.997" fill="#000" font-size="12" textLength="133.441">Privacy input boundary</text><text x="26" y="585.13" fill="#000" font-size="12" textLength="222.176">Minimize, scrub, pseudonymize, audit</text><rect x="278.176" y="549.396" width="148.285" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="288.176" y="570.997" fill="#000" font-size="12" textLength="128.285">Public guidance result</text><polygon points="244.703,603.661,256.703,615.661,244.703,627.661,232.703,615.661,244.703,603.661" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="111.123" y="647.661" width="267.16" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="121.123" y="669.263" fill="#000" font-size="12" textLength="177.744">Tool results or safe tool errors</text><text x="121.123" y="683.396" fill="#000" font-size="12" textLength="247.16">returned to model; increment round count</text><polygon points="188.599,377.02,300.807,377.02,312.807,389.02,300.807,401.02,188.599,401.02,176.599,389.02,188.599,377.02" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="248.703" y="411.654" fill="#000" font-size="11" textLength="17.483">yes</text><text x="188.599" y="393.177" fill="#000" font-size="11" textLength="112.208">Tool calls requested?</text><polygon points="244.703,715.927,256.703,727.927,244.703,739.927,232.703,727.927,244.703,715.927" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="244.703,214.887,256.703,226.887,244.703,238.887,232.703,226.887,244.703,214.887" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="188.599,759.927,300.807,759.927,312.807,771.927,300.807,783.927,188.599,783.927,176.599,771.927,188.599,759.927" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="248.703" y="794.562" fill="#000" font-size="11" textLength="13.583">no</text><text x="188.599" y="776.084" fill="#000" font-size="11" textLength="112.208">Tool calls requested?</text><text x="312.807" y="769.606" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="101.607" y="816.062" width="286.191" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.607" y="837.663" fill="#000" font-size="12" textLength="266.191">Output boundary: stream answer and sources</text><text x="111.607" y="851.796" fill="#000" font-size="12" textLength="211.459">Persist conversation and tool results</text><path d="M275.703,874.327 L275.703,913.604 L255.703,917.604 L275.703,921.604 L275.703,960.88 A0,0 0 0 0 275.703,960.88 L582.614,960.88 A0,0 0 0 0 582.614,960.88 L582.614,884.327 L572.614,874.327 L275.703,874.327 A0,0 0 0 0 275.703,874.327" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M572.614,874.327 L572.614,884.327 L582.614,884.327 L572.614,874.327" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="281.703" y="891.896" fill="#000" font-size="13" textLength="285.911">Six rounds, possibly multiple calls per round.</text><text x="281.703" y="907.206" fill="#000" font-size="13" textLength="233.486">Initial retrieval is not a model choice.</text><text x="281.703" y="922.517" fill="#000" font-size="13" textLength="272.657">Retrieved links do not prove claim support.</text><text x="281.703" y="937.827" fill="#000" font-size="13" textLength="266.062">Gateway audit covers its financial context,</text><text x="281.703" y="953.138" fill="#000" font-size="13" textLength="246.873">not the complete conversation prompt.</text><ellipse cx="244.703" cy="917.604" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="244.703" cy="917.604" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="244.703" y1="72.488" x2="244.703" y2="92.488" style="stroke:#181818;stroke-width:1;"/><polygon points="240.703,82.488,244.703,92.488,248.703,82.488,244.703,86.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.703" y1="126.621" x2="244.703" y2="146.621" style="stroke